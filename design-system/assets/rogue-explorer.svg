<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 130" width="480" height="260">
<style>
.ink, .cape { fill: #0A1B35 } .face { fill: #FCF3E1 } .scarf, .lamp { fill: #F7792C }
.pole { stroke: #0A1B35; stroke-width: 2.4; stroke-linecap: round } .pole.thin { stroke-width: 1.2 }
.leg { stroke: #0A1B35; stroke-width: 4.2; stroke-linecap: round; fill: none }
.lamp-glow, .dust circle, .bubble { opacity: 0 } .lamp-glow { fill: #F7792C }
.espera .bubble { opacity: 1 } .espera .lamp-glow { opacity: 0.4 }
.bubble-box { fill: #FCF3E1; stroke: #0A1B35; stroke-width: 1.6 } .dot { fill: #0A1B35 }
.explora .leg-a { transform: rotate(18deg) } .explora .leg-b { transform: rotate(-18deg) }
.leg { transform-box: fill-box; transform-origin: 50% 0% }
</style>
